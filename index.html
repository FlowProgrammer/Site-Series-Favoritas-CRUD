<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Favoritas</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Séries Favoritas</h1>
        <button id="btnNovo" class="btn-primario">Nova Série</button>
    </header>
    <main>
        <div id="listaSeries" class="lista-series">

        </div>
        <section id="modal" class="modal hidden">
            <article class="modal-content" id="modal-content">

            <h2 id="tituloModal" class="titulo-modal">Nova Série</h2>
            <input type="text" id="nome" placeholder="Digite o nome da Série">
            <input type="number" id="nota" placeholder="Digite a nota Série">
            <article id="acoes" class="acoes">
                <button  id="salvar" class="btn-primario">Salvar</button>
                <button id="cancelar" class="btn-secundario">Cancelar</button>
            </article>
            </article>
        </section>
    </main>
    
</body>
</html>
